# Publishes @trustware/sdk (production) and @trustware/sdk-staging (staging)
# to npm. Triggered by version tags — never by branch pushes.
#
# Tag conventions
#   v1.2.3              → @trustware/sdk@1.2.3            → env npm-production
#   v1.2.3-staging.5    → @trustware/sdk-staging@1.2.3-staging.5 → env npm-staging
#
# Why tag-driven (and not workflow_run): `workflow_run` jobs execute in the
# repo's default-branch context. The npm-production environment's deployment
# branch policy can only allow specific refs, and a workflow_run originating
# from a CI completion on `main` still runs in the (current) default branch
# `staging` context — which the env rejects. Tag pushes run in the tag's
# context, which we allow via tag-pattern policies on each environment.
#
# CI gating: tags should only be cut from commits that already passed CI on
# their source branch. This workflow runs `npm run validate` again before
# publishing as belt-and-suspenders.

name: Publish

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-staging.[0-9]+'
  workflow_dispatch:

permissions: {}

jobs:
  publish-staging:
    if: contains(github.ref_name, '-staging.')
    runs-on: ubuntu-latest
    environment: npm-staging
    permissions:
      id-token: write   # Required for npm trusted publishing (OIDC)
      contents: write   # Required to create the GitHub Release
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # git-cliff needs full history to walk tags

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      # setup-node writes `always-auth=false` to ~/.npmrc when registry-url
      # is set; npm 11+ no longer recognizes that key and emits a warning on
      # every command. Strip it.
      - name: Strip deprecated always-auth from npmrc
        run: sed -i '/^always-auth=/d' "$HOME/.npmrc" || true

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: npm run validate

      # Rewrite name + version, then build. Build must run AFTER this rewrite
      # so SDK_VERSION baked into the bundle matches the published npm version.
      - name: Prepare staging package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "
            const pkg = require('./package.json');
            pkg.name = '@trustware/sdk-staging';
            pkg.version = '$VERSION';
            pkg.publishConfig = { registry: 'https://registry.npmjs.org/' };
            require('fs').writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Build (staging API)
        run: npm run build
        env:
          TRUSTWARE_API_ROOT: ${{ secrets.TRUSTWARE_API_ROOT }}
          TRUSTWARE_GTM_ID: ${{ secrets.TRUSTWARE_GTM_ID }}
          TRUSTWARE_WALLETCONNECT_PROJECT_ID: ${{ secrets.TRUSTWARE_WALLETCONNECT_PROJECT_ID }}

      - name: Publish to npm (staging)
        # sigstore is co-installed because npm 12.0.0's tarball omits it even
        # though libnpmpublish depends on it (^5.0.0), which breaks
        # `publish --provenance` with MODULE_NOT_FOUND. Drop the extra -p once
        # npm bundles it again.
        run: npx -y -p npm@12 -p sigstore@^5.0.0 npm publish --access public --tag staging --provenance

      # Staging release notes show every commit since the last production tag,
      # giving a running preview of what's heading to prod next.
      #
      # The range is resolved explicitly instead of relying on `--unreleased`:
      # production release commits are only ever made on `main` and are never
      # merged back into `staging`, so no recent production tag is an *ancestor*
      # of a staging tag. `--unreleased` walks by ancestry, so it fell back to
      # the last production tag staging can actually see (v1.1.1) and rendered
      # 216 commits instead of the 6 that were genuinely new.
      #
      # Do NOT pass --tag here: the staging tag matches cliff.toml's skip_tags,
      # so git-cliff would skip the release and emit an empty body. Without
      # --tag the commits render under an "[Unreleased]" heading.
      # The pattern is anchored to exactly vMAJOR.MINOR.PATCH — the same shape as
      # cliff.toml's `tag_pattern` — so every prerelease is excluded, not just
      # `-staging.N`. A looser glob would let a `v1.2.0-rc.1` sort above the real
      # newest release and truncate the range. `tail` always exits 0, so a repo
      # with no production tag yet still falls back to an empty prefix (HEAD).
      - name: Resolve last production tag
        id: lasttag
        run: |
          LAST=$(git tag -l | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          echo "Last production tag: ${LAST:-<none>}"
          echo "range=${LAST:+$LAST..}HEAD" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: ${{ steps.lasttag.outputs.range }} --strip all

      - name: Create GitHub Release (staging)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.content }}
          prerelease: true

  publish-production:
    if: ${{ !contains(github.ref_name, '-staging.') }}
    runs-on: ubuntu-latest
    environment: npm-production
    permissions:
      id-token: write
      contents: write   # Required to create the GitHub Release
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # git-cliff needs full history to walk tags

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Strip deprecated always-auth from npmrc
        run: sed -i '/^always-auth=/d' "$HOME/.npmrc" || true

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: npm run validate

      - name: Build (production API)
        run: npm run build
        env:
          TRUSTWARE_API_ROOT: ${{ secrets.TRUSTWARE_API_ROOT }}
          TRUSTWARE_GTM_ID: ${{ secrets.TRUSTWARE_GTM_ID }}
          TRUSTWARE_WALLETCONNECT_PROJECT_ID: ${{ secrets.TRUSTWARE_WALLETCONNECT_PROJECT_ID }}

      - name: Publish to npm
        # sigstore is co-installed because npm 12.0.0's tarball omits it even
        # though libnpmpublish depends on it (^5.0.0), which breaks
        # `publish --provenance` with MODULE_NOT_FOUND. Drop the extra -p once
        # npm bundles it again.
        run: npx -y -p npm@12 -p sigstore@^5.0.0 npm publish --access public --provenance

      # Use --latest, NOT `--tag <tag> --unreleased`. The tag already exists by
      # the time this runs (pushing it is what triggered the workflow), so
      # "unreleased" matches zero commits and the body renders empty — which is
      # how v1.1.8, v1.1.9 and v1.1.10 all shipped with empty release notes.
      # --latest renders the newest production tag's section instead.
      - name: Generate release notes
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip all

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.content }}
